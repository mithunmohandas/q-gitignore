name: Daily Repository Update

on:
  schedule:
    # Runs at 05:30 UTC every day. 
    # Must use specific numbers, not '*' for hours/minutes per requirements.
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows you to trigger it manually for the grader

jobs:
  automated_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git for 23f2004369@ds.study.iitm.ac.in
        run: |
          git config --global user.name "DevSync Automation"
          git config --global user.email "23f2004369@ds.study.iitm.ac.in"

      - name: Create Daily Update Log
        run: |
          echo "Last automated update: $(date)" > daily_log.txt
          git add daily_log.txt

      - name: Commit and Push changes
        run: |
          git commit -m "Automated daily update [skip ci]" || echo "No changes to commit"
          git push
